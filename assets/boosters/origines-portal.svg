<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-label="Portail de verre lumineux dans les ruines des Origines">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.95" y2="1"><stop stop-color="#111328"/><stop offset=".3" stop-color="#1e2046"/><stop offset=".68" stop-color="#3a2b60"/><stop offset="1" stop-color="#0c2034"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#a9f9fa" stop-opacity=".72"/><stop offset=".26" stop-color="#4fb8d7" stop-opacity=".41"/><stop offset=".57" stop-color="#b478dd" stop-opacity=".21"/><stop offset="1" stop-color="#080d29" stop-opacity="0"/></radialGradient>
  <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4d8"/><stop offset=".52" stop-color="#e7d4f9"/><stop offset="1" stop-color="#86cde2"/></linearGradient>
  <linearGradient id="gate" x1=".02" y1=".04" x2="1" y2=".95"><stop stop-color="#060f2b"/><stop offset=".32" stop-color="#4976a1"/><stop offset=".51" stop-color="#d6eef7"/><stop offset=".66" stop-color="#716dca"/><stop offset="1" stop-color="#120c3d"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8bce6"/><stop offset=".28" stop-color="#645f9d"/><stop offset=".5" stop-color="#dbb98b"/><stop offset=".73" stop-color="#4b587f"/><stop offset="1" stop-color="#e6d8f0"/></linearGradient>
  <linearGradient id="shard" x1="0" y1=".2" x2="1" y2=".8"><stop stop-color="#b3f2f4"/><stop offset=".24" stop-color="#86cfe3"/><stop offset=".5" stop-color="#454d8e"/><stop offset=".77" stop-color="#c1b0e5"/><stop offset="1" stop-color="#3b315a"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#283a55"/><stop offset="1" stop-color="#070e24"/></linearGradient>
  <pattern id="starPattern" width="89" height="107" patternUnits="userSpaceOnUse"><path d="M14 21v3m-1.5-1.5h3M65 76v4m-2-2h4" stroke="#e1defc" stroke-opacity=".29"/><circle cx="43" cy="48" r="1.2" fill="#b6e3f9" opacity=".55"/><circle cx="81" cy="12" r=".75" fill="#f6d7d4" opacity=".6"/></pattern>
