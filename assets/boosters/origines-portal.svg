  <filter id="smallGlow"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="innerGate"><path d="M300 230 C378 279 395 350 390 450 Q383 546 300 616 Q217 546 210 450 C205 350 222 279 300 230Z"/></clipPath>
</defs>
