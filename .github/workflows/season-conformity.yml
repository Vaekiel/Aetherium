name: Season conformity

on:
  push:
    branches:
      - main
      - chantier-09-futures-saisons
  pull_request:

permissions:
  contents: read

jobs:
  season-conformity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/season-release-gate.mjs
      - run: node --experimental-default-type=module tests/season-conformity-smoke.mjs
