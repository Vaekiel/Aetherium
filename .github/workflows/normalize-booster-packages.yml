name: One-shot normalize booster packaging
on:
  push:
    branches: [main]
    paths:
      - scripts/normalize-booster-packages.py
      - .github/workflows/normalize-booster-packages.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Normalize original HD booster images
        run: python scripts/normalize-booster-packages.py
      - name: Commit generated art and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boosters/origines-reliquaire-normalized-v2.webp assets/boosters/reflets-brises-reliquaire-normalized-v2.webp
          git rm .github/workflows/normalize-booster-packages.yml
          git commit -m "assets: normaliser deux pochettes de même format sur fond transparent"
          git push origin HEAD:main
