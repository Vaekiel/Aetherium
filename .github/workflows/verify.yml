name: Verify static game

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Check Archives Vivantes rules
        run: node --experimental-default-type=module --test tests/living-archives.test.mjs
      - name: Verify portable backup and rollback safety
        run: node --experimental-default-type=module --test tests/save-backup.test.mjs
      - name: Check rarity-based duplicate rewards
        run: node --experimental-default-type=module --test tests/duplicate-rewards.test.mjs
      - name: Audit seeded collection economy
        run: node scripts/audit-economy.mjs
      - name: Simulate targeted finish Forge
        run: node scripts/audit-finish-forge.mjs
      - name: Audit trial reward efficiency
        run: node scripts/audit-trial-economy.mjs
      - name: Run full game and future collection smoke test suite
        run: |
          failed=0
          for test_file in tests/*-smoke.mjs; do
            echo "Running $test_file"
            node "$test_file" || failed=1
          done
          exit "$failed"
      - name: Exercise the booster gallery in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aetherium-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --remote-allow-origins='*' \
            --remote-debugging-port=9222 --user-data-dir=/tmp/aetherium-gallery-browser \
            'http://127.0.0.1:8765/#boosters' >/tmp/aetherium-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$SERVER_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          AETHERIUM_BROWSER_TEST=1 node tests/booster-browser-smoke.mjs
          AETHERIUM_BROWSER_TEST=1 node tests/trial-responsive-browser-smoke.mjs
          AETHERIUM_BROWSER_TEST=1 node tests/chromatic-browser-smoke.mjs
          AETHERIUM_BROWSER_TEST=1 node tests/onboarding-browser-smoke.mjs
