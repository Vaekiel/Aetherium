name: One-time unify printed booster metadata
on:
  push:
    branches: [main]
    paths:
      - scripts/unify-booster-typography.py
      - .github/workflows/unify-booster-typography.yml
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow and OpenCV
        run: python -m pip install --disable-pip-version-check pillow opencv-python-headless
      - name: Update existing booster lettering without changing illustrations
        run: python scripts/unify-booster-typography.py
      - name: Save harmonized premium packs, then remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boosters/origines-reliquaire-unified-v4.webp assets/boosters/reflets-brises-reliquaire-unified-v4.webp
          git rm .github/workflows/unify-booster-typography.yml
          git commit -m "assets: aligner Saison 1 et 5 cartes sur les trois pochettes"
          git push origin HEAD:main
