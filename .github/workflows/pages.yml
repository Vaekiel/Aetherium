          test -s tests/trial-titles-smoke.mjs
          test -s tests/trial-challenges-smoke.mjs
          test -s tests/trial-records-smoke.mjs
          test -s src/trial-progress.css
          test -s tests/trial-progress-smoke.mjs
          test -s tests/mastery-economy-smoke.mjs
          test -s tests/codex-smoke.mjs
          test -s tests/codex-responsive-smoke.mjs
          test -s tests/chromatic-smoke.mjs
          test -s src/crafting.js
          test -s tests/navigation-smoke.mjs
          test -s tests/crafting-smoke.mjs
          test -s assets/scenery/dusk-right.webp
          test -s assets/scenery/dusk-horizon.webp
          test -s tests/interface-smoke.mjs
          test -s assets/minigames/alchemy-atlas.webp
          test -s tests/alchemy-smoke.mjs
          test -s assets/minigames/excavation-atlas.webp
          test -s tests/mines-smoke.mjs
          test -s assets/minigames/ether-lock-atlas.webp
          test -s tests/lock-smoke.mjs
          test -s assets/minigames/runes-origines-compact.webp
          test -s assets/minigames/minigame-emblems.webp
          test -s tests/runes-smoke.mjs
          test -f tests/booster-smoke.mjs
          test -s tests/booster-reveal-smoke.mjs
          test -s tests/booster-feedback-smoke.mjs
          test -s tests/booster-opening-smoke.mjs
          grep -q 'id="filter-open"' index.html
          grep -q 'id="inspect-close"' index.html
          grep -q 'id="game-picker"' index.html
          grep -q 'id="booster-progress"' index.html
          grep -q 'id="reveal-all"' index.html
          grep -q 'src/booster.css' index.html
          grep -q 'src/runes.css' index.html
          grep -q 'src/lock.css' index.html
          grep -q 'src/mines.css' index.html
          grep -q 'src/shell.css' index.html
          grep -q 'src/navigation.css' index.html
          grep -q 'src/crafting.css' index.html
          grep -q 'src/chromatic.css' index.html
