name: Publish AETHERIUM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify browser app
        run: |
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f src/data.js
          test -f src/art.js
          test -f src/card-art.js
          test -f src/scenery.js
          test -f src/theme.css
          test -f src/mobile.css
          test -s src/booster.css
          test -s src/runes.css
          test -s src/rune-rituals.js
          test -s src/ether-lock-puzzles.js
          test -s tests/ether-lock-puzzles-smoke.mjs
          test -s tests/rune-rituals-smoke.mjs
          test -s src/memory.css
          test -s src/memory-rituals.js
          test -s tests/memory-rituals-smoke.mjs
          test -s src/lock.css
          test -s src/mines.css
          test -s src/excavation-sites.js
          test -s tests/excavation-sites-smoke.mjs
          test -s src/alchemy.css
          test -s src/alchemy-rituals.js
          test -s tests/alchemy-rituals-smoke.mjs
          test -s src/shell.css
          test -s src/navigation.css
          test -s src/crafting.css
          test -s src/chromatic.css
          test -s src/codex.css
          test -s src/codex.js
          test -s src/seasons.js
          test -s src/collection-milestones.js
          test -s tests/collection-milestones-smoke.mjs
          test -s src/trial-progress.js
          test -s src/trial-records.js
          test -s tests/trial-records-smoke.mjs
          test -s src/trial-progress.css
          test -s tests/trial-progress-smoke.mjs
          test -s tests/codex-smoke.mjs
          test -s tests/chromatic-smoke.mjs
          test -s src/crafting.js
          test -s tests/navigation-smoke.mjs
          test -s tests/crafting-smoke.mjs
          test -s assets/scenery/dusk-right.webp
          test -s assets/scenery/dusk-horizon.webp
          test -s tests/interface-smoke.mjs
          test -s assets/minigames/alchemy-atlas.webp
          test -s tests/alchemy-smoke.mjs
          test -s assets/minigames/excavation-atlas.webp
          test -s tests/mines-smoke.mjs
          test -s assets/minigames/ether-lock-atlas.webp
          test -s tests/lock-smoke.mjs
          test -s assets/minigames/runes-origines-compact.webp
          test -s assets/minigames/minigame-emblems.webp
          test -s tests/runes-smoke.mjs
          test -f tests/booster-smoke.mjs
          grep -q 'id="filter-open"' index.html
          grep -q 'id="inspect-close"' index.html
          grep -q 'id="game-picker"' index.html
          grep -q 'id="booster-progress"' index.html
          grep -q 'id="reveal-all"' index.html
          grep -q 'src/booster.css' index.html
          grep -q 'src/runes.css' index.html
          grep -q 'src/lock.css' index.html
          grep -q 'src/mines.css' index.html
          grep -q 'src/shell.css' index.html
          grep -q 'src/navigation.css' index.html
          grep -q 'src/crafting.css' index.html
          grep -q 'src/chromatic.css' index.html
          grep -q 'data-finish="chromatic"' index.html
          grep -q 'id="atelier-confirm"' index.html
          grep -q 'src/alchemy.css' index.html
          test -s assets/cards/veilleuse-de-nacre.webp
          test -s assets/cards/veilleuse-de-nacre-thumb.webp
          test -s assets/cards/sylve-eclaireuse.webp
          test -s assets/cards/sylve-eclaireuse-thumb.webp
          test -s assets/cards/golem-de-rouille.webp
          test -s assets/cards/golem-de-rouille-thumb.webp
          test -s assets/cards/floraison-cendree.webp
          test -s assets/cards/floraison-cendree-thumb.webp
          test -s assets/cards/epee-de-brume.webp
          test -s assets/cards/epee-de-brume-thumb.webp
          test -s assets/cards/feu-follet.webp
          test -s assets/cards/feu-follet-thumb.webp
          test -s assets/cards/archiviste-nocturne.webp
          test -s assets/cards/archiviste-nocturne-thumb.webp
          test -s assets/cards/cerf-des-lueurs.webp
          test -s assets/cards/cerf-des-lueurs-thumb.webp
          test -s assets/cards/meduse-d-ether.webp
          test -s assets/cards/meduse-d-ether-thumb.webp
          test -s assets/cards/lame-prismatique.webp
          test -s assets/cards/lame-prismatique-thumb.webp
          test -s assets/cards/chant-des-cendres.webp
          test -s assets/cards/chant-des-cendres-thumb.webp
          test -s assets/cards/gardienne-de-jade.webp
          test -s assets/cards/gardienne-de-jade-thumb.webp
          test -s assets/cards/roi-des-lucioles.webp
          test -s assets/cards/roi-des-lucioles-thumb.webp
          test -s assets/cards/horloge-du-neant.webp
          test -s assets/cards/horloge-du-neant-thumb.webp
          test -s assets/cards/dragon-de-cristal.webp
          test -s assets/cards/dragon-de-cristal-thumb.webp
          test -s assets/cards/oracle-des-marees.webp
          test -s assets/cards/oracle-des-marees-thumb.webp
          test -s assets/cards/pluie-astrale.webp
          test -s assets/cards/pluie-astrale-thumb.webp
          test -s assets/cards/lion-d-obsidienne.webp
          test -s assets/cards/lion-d-obsidienne-thumb.webp
          test -s assets/cards/eclipse-vivante.webp
          test -s assets/cards/eclipse-vivante-thumb.webp
          test -s assets/cards/reine-des-ronces.webp
          test -s assets/cards/reine-des-ronces-thumb.webp
          test -s assets/cards/coeur-du-colosse.webp
          test -s assets/cards/coeur-du-colosse-thumb.webp
          test -s assets/cards/astra-reine-fractale.webp
          test -s assets/cards/astra-reine-fractale-thumb.webp
          test -s assets/cards/vyrath-fleau-celeste.webp
          test -s assets/cards/vyrath-fleau-celeste-thumb.webp
          test -s assets/cards/derniere-etoile.webp
          test -s assets/cards/derniere-etoile-thumb.webp
          grep -q '  24: Object.freeze' src/card-art.js
          node --check --input-type=module < src/main.js
          node --check --input-type=module < src/codex.js
          node --check --input-type=module < src/seasons.js
          node --check --input-type=module < src/collection-milestones.js
          node --check --input-type=module < src/trial-progress.js
          node --check --input-type=module < src/trial-records.js
          node --check --input-type=module < src/rune-rituals.js
          node --check --input-type=module < src/ether-lock-puzzles.js
          node --check --input-type=module < src/memory-rituals.js
          node --check --input-type=module < src/excavation-sites.js
          node --check --input-type=module < src/alchemy-rituals.js
          node tests/booster-smoke.mjs
          node tests/runes-smoke.mjs
          node tests/rune-rituals-smoke.mjs
          node tests/memory-smoke.mjs
          node tests/memory-rituals-smoke.mjs
          node tests/lock-smoke.mjs
          node tests/ether-lock-puzzles-smoke.mjs
          node tests/mines-smoke.mjs
          node tests/excavation-sites-smoke.mjs
          node tests/alchemy-smoke.mjs
          node tests/alchemy-rituals-smoke.mjs
          node tests/interface-smoke.mjs
          node tests/navigation-smoke.mjs
          node tests/crafting-smoke.mjs
          node tests/chromatic-smoke.mjs
          node tests/codex-smoke.mjs
          node tests/collection-milestones-smoke.mjs
          node tests/trial-progress-smoke.mjs
          node tests/trial-records-smoke.mjs
          node --check --input-type=module < src/crafting.js
          node --check --input-type=module < src/data.js
          node --check --input-type=module < src/art.js
          node --check --input-type=module < src/card-art.js
          node --check --input-type=module < src/scenery.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
