          test -s assets/cards/veilleuse-de-nacre-thumb.webp
          test -s assets/cards/sylve-eclaireuse.webp
          test -s assets/cards/sylve-eclaireuse-thumb.webp
          test -s assets/cards/golem-de-rouille.webp
          test -s assets/cards/golem-de-rouille-thumb.webp
          test -s assets/cards/floraison-cendree.webp
          test -s assets/cards/floraison-cendree-thumb.webp
          test -s assets/cards/epee-de-brume.webp
          test -s assets/cards/epee-de-brume-thumb.webp
          test -s assets/cards/feu-follet.webp
          test -s assets/cards/feu-follet-thumb.webp
          test -s assets/cards/archiviste-nocturne.webp
          test -s assets/cards/archiviste-nocturne-thumb.webp
          test -s assets/cards/cerf-des-lueurs.webp
          test -s assets/cards/cerf-des-lueurs-thumb.webp
          test -s assets/cards/meduse-d-ether.webp
          test -s assets/cards/meduse-d-ether-thumb.webp
          test -s assets/cards/lame-prismatique.webp
          test -s assets/cards/lame-prismatique-thumb.webp
          test -s assets/cards/chant-des-cendres.webp
          test -s assets/cards/chant-des-cendres-thumb.webp
          test -s assets/cards/gardienne-de-jade.webp
          test -s assets/cards/gardienne-de-jade-thumb.webp
          test -s assets/cards/roi-des-lucioles.webp
          test -s assets/cards/roi-des-lucioles-thumb.webp
          test -s assets/cards/horloge-du-neant.webp
          test -s assets/cards/horloge-du-neant-thumb.webp
          test -s assets/cards/dragon-de-cristal.webp
          test -s assets/cards/dragon-de-cristal-thumb.webp
          test -s assets/cards/oracle-des-marees.webp
          test -s assets/cards/oracle-des-marees-thumb.webp
          test -s assets/cards/pluie-astrale.webp
          test -s assets/cards/pluie-astrale-thumb.webp
          test -s assets/cards/lion-d-obsidienne.webp
