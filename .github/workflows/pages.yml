name: Publish AETHERIUM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use the same Node.js runtime as CI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser app
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          test -f index.html
          test -f src/main.js
          test -f src/style.css
          test -f src/data.js
          test -f src/art.js
          test -f src/card-art.js
          test -f src/scenery.js
          test -f src/theme.css
          test -f src/mobile.css
          test -s src/booster.css
          test -s src/booster-packaging.css
          test -s src/booster-artworks.css
          test -s src/booster-feedback.css
          test -s src/booster-feedback.js
          test -s assets/boosters/origines-pack-hd.webp
          test -s assets/boosters/reflets-brises-pack-hd.webp
          test -s assets/boosters/origines-pack-pixel-hd-v2.webp
          test -s assets/boosters/reflets-brises-pack-pixel-hd-v2.webp
          test -s tests/booster-artworks-smoke.mjs
          test -s tests/booster-variety-smoke.mjs
          test -s assets/boosters/origines-portal.svg
          test -s tests/booster-packaging-smoke.mjs
          test -s src/runes.css
          test -s src/rune-rituals.js
          test -s src/ether-lock-puzzles.js
          test -s tests/ether-lock-puzzles-smoke.mjs
          test -s tests/rune-rituals-smoke.mjs
          test -s src/memory.css
          test -s src/memory-rituals.js
          test -s tests/memory-rituals-smoke.mjs
          test -s src/lock.css
          test -s src/mines.css
          test -s src/excavation-sites.js
          test -s tests/excavation-sites-smoke.mjs
          test -s src/alchemy.css
          test -s src/alchemy-rituals.js
          test -s tests/alchemy-rituals-smoke.mjs
          test -s src/shell.css
          test -s src/navigation.css
          test -s src/crafting.css
          test -s src/chromatic.css
          test -s src/codex.css
          test -s src/codex.js
          test -s src/save-backup.js
          test -s src/reflets-brises-catalog.js
          test -s src/au-dela-du-verre-catalog.js
          test -s tests/au-dela-du-verre-smoke.mjs
          test -s tests/au-dela-pilot-smoke.mjs
          test -s assets/cards/passeur-des-aubes.webp
          test -s assets/cards/passeur-des-aubes-thumb.webp
          test -s src/au-dela-gallery.js
          test -s src/au-dela-gallery.css
          test -s tests/au-dela-gallery-smoke.mjs
          for slug in mousse-de-l-entreverre lanternes-jumelles brume-des-deux-rivages mesange-de-la-couture boussole-du-dedans emissaire-des-possibles tisserande-de-quartz clef-de-l-horizon rite-des-voix-accordees; do
            test -s "assets/cards/${slug}.webp"
            test -s "assets/cards/${slug}-thumb.webp"
          done
          test -s src/reflets-preview.css
          test -s src/reflets-gallery.css
          test -s src/reflets-gallery.js
          test -s src/collection-data.js
          test -s src/reflets-booster.css
          test -s tests/reflets-booster-smoke.mjs
          test -s tests/reflets-gallery-smoke.mjs
          test -s tests/reflets-pilot-preview-smoke.mjs
          test -s assets/cards/cerf-sans-reflet.webp
          test -s assets/cards/cerf-sans-reflet-thumb.webp
          for slug in eclat-fugueur guetteuse-du-revers papillon-de-silice pluie-a-l-envers miroir-d-ecorce loup-aux-deux-ombres cartographe-des-absents sentinelle-des-felures fil-des-deux-rives serment-retourne; do
            test -s "assets/cards/${slug}.webp"
            test -s "assets/cards/${slug}-thumb.webp"
          done
          test -s tests/reflets-brises-smoke.mjs
          test -s docs/reflets-brises-design.md
          test -s src/duplicate-rewards.js
          test -s tests/duplicate-rewards.test.mjs
          test -s src/save-backup.css
          test -s tests/save-backup.test.mjs
          test -s tests/save-backup-smoke.mjs
          test -s src/seasons.js
          test -s src/collection-milestones.js
          test -s tests/collection-milestones-smoke.mjs
          test -s src/trial-progress.js
          test -s src/trial-records.js
          test -s src/trial-challenges.js
