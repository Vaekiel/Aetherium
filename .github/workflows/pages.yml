          test -s assets/cards/astra-reine-fractale.webp
          test -s assets/cards/astra-reine-fractale-thumb.webp
          test -s assets/cards/vyrath-fleau-celeste.webp
          test -s assets/cards/vyrath-fleau-celeste-thumb.webp
          test -s assets/cards/derniere-etoile.webp
          test -s assets/cards/derniere-etoile-thumb.webp
          grep -q '  24: Object.freeze' src/card-art.js
          node --check --input-type=module < src/main.js
          node --check --input-type=module < src/save-backup.js
          node --check --input-type=module < src/reflets-brises-catalog.js
          node --check --input-type=module < src/au-dela-du-verre-catalog.js
          node --check --input-type=module < src/au-dela-gallery.js
          node --check --input-type=module < src/reflets-gallery.js
          node --check --input-type=module < src/duplicate-rewards.js
          node --check --input-type=module < src/codex.js
          node --check --input-type=module < src/seasons.js
          node --check --input-type=module < src/collection-milestones.js
          node --check --input-type=module < src/trial-progress.js
          node --check --input-type=module < src/trial-records.js
          node --check --input-type=module < src/trial-challenges.js
          node --check --input-type=module < src/trial-titles.js
          node --check --input-type=module < src/expeditions.js
          node --check --input-type=module < src/rune-rituals.js
          node --check --input-type=module < src/ether-lock-puzzles.js
          node --check --input-type=module < src/memory-rituals.js
          node --check --input-type=module < src/excavation-sites.js
          node --check --input-type=module < src/alchemy-rituals.js
          node --experimental-default-type=module --test tests/save-backup.test.mjs
          node --experimental-default-type=module --test tests/duplicate-rewards.test.mjs
          node tests/save-backup-smoke.mjs
          node tests/reflets-brises-smoke.mjs
          node tests/au-dela-du-verre-smoke.mjs
          node tests/au-dela-pilot-smoke.mjs
          node tests/au-dela-gallery-smoke.mjs
          node tests/reflets-pilot-preview-smoke.mjs
          node tests/reflets-gallery-smoke.mjs
          node tests/reflets-booster-smoke.mjs
          node tests/booster-smoke.mjs
          node tests/booster-variety-smoke.mjs
          node tests/booster-reveal-smoke.mjs
          node tests/booster-feedback-smoke.mjs
          node tests/booster-opening-smoke.mjs
          node tests/booster-packaging-smoke.mjs
          node tests/booster-artworks-smoke.mjs
          node tests/runes-smoke.mjs
          node tests/rune-rituals-smoke.mjs
          node tests/memory-smoke.mjs
          node tests/memory-rituals-smoke.mjs
          node tests/lock-smoke.mjs
