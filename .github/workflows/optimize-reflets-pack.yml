name: Optimize approved Reflets booster (temporary)
on:
  push:
    branches:
      - design/reflets-brises-pack-valide

permissions:
  contents: write

jobs:
  optimize-reflets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert approved PNG to optimized HD WebP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "assets/boosters/reflets-brises-approved-source.png" ]; then
            echo "No source PNG to optimize."
            exit 0
          fi
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("assets/boosters/reflets-brises-approved-source.png")
          target = Path("assets/boosters/reflets-brises-pack-pixel-hd-v2.webp")
          with Image.open(source) as img:
              img.convert("RGB").save(target, "WEBP", quality=88, method=6)
          with Image.open(target) as test:
              assert test.format == "WEBP" and test.width >= 1000 and test.height >= 1400
          assert 50_000 < target.stat().st_size < 700_000, target.stat().st_size
          print(f"Optimized: {target} ({target.stat().st_size} bytes)")
          source.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/boosters/reflets-brises-approved-source.png" "assets/boosters/reflets-brises-pack-pixel-hd-v2.webp"
          git commit -m "assets: use approved Reflets brisés pack as optimized WebP"
          git push origin HEAD:design/reflets-brises-pack-valide
